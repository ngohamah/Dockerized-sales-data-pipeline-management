name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Full end-to-end data-flow validation runs nightly rather than on every
    # push (the full stack is slow to boot in CI) — see implementationmap.md.
    - cron: "0 3 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

  build-images:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        run: cp .env.example .env
      - name: Build all Docker images
        run: docker compose build

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        run: |
          cp .env.example .env
          echo "AIRFLOW_FERNET_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> .env
      - name: Start fast-booting services (postgres, minio, metabase)
        run: docker compose up -d postgres minio metabase
      - name: Wait for postgres/minio health checks
        run: |
          for svc in postgres minio; do
            status="starting"
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "dem12-$svc" 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "$svc did not become healthy"
              docker compose logs "$svc"
              exit 1
            fi
          done
      - name: Tear down
        if: always()
        run: docker compose down -v

  data-flow-validation:
    # Full MinIO -> Airflow -> Postgres -> Metabase check. Deliberately not
    # run on every push (Airflow alone can take minutes to boot) — only on
    # manual dispatch or the nightly schedule. See implementationmap.md.
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        run: |
          cp .env.example .env
          echo "AIRFLOW_FERNET_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> .env

      - name: Start full platform
        run: docker compose up -d

      - name: Wait for Airflow webserver
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 10
          done
          echo "Airflow webserver never became healthy"; exit 1

      - name: Run data generator once (populates MinIO)
        run: docker compose run --rm data-generator

      - name: Unpause and trigger the sales_pipeline DAG
        run: |
          docker compose exec -T airflow-webserver airflow dags unpause sales_pipeline
          trigger_output=$(docker compose exec -T airflow-webserver airflow dags trigger sales_pipeline -o plain)
          echo "$trigger_output"
          run_id=$(echo "$trigger_output" | grep -oE 'manual__[0-9T:+-]+' | head -n1)
          if [ -z "$run_id" ]; then
            echo "Could not extract run_id from trigger output"; exit 1
          fi
          echo "Triggered run: $run_id"
          echo "SALES_PIPELINE_LOGICAL_DATE=${run_id#manual__}" >> "$GITHUB_ENV"

      - name: Wait for the DAG run to finish
        run: |
          # Poll the specific run we triggered by logical_date, not "the last row of
          # list-runs" — that output is sorted newest-first, so tail-based parsing
          # was silently checking an unrelated (often older, auto-scheduled) run.
          for i in $(seq 1 60); do
            state=$(docker compose exec -T airflow-webserver \
              airflow dags state sales_pipeline "$SALES_PIPELINE_LOGICAL_DATE" 2>/dev/null | tr -d '\r\n')
            echo "Poll $i: state=$state"
            [ "$state" = "success" ] && exit 0
            [ "$state" = "failed" ] && { echo "DAG run failed"; exit 1; }
            sleep 10
          done
          echo "DAG run did not finish in time"; exit 1

      - name: Verify rows landed in Postgres app_data
        run: |
          set -a; source .env; set +a
          count=$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d app_data -tAc "SELECT COUNT(*) FROM sales_records;")
          echo "Row count: $count"
          [ "$count" -gt 0 ]

      - name: Verify Metabase API is reachable
        run: curl -sf http://localhost:3000/api/health

      - name: Collect compose logs
        if: always()
        run: docker compose logs > compose-logs.txt || true

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
